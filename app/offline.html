<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PrefSADE Serviços Digitais | Offline</title>
    <meta name="theme-color" content="#0d2d62">
    <style>
        :root {
            --primary: #0d2d62;
            --primary-soft: #d9e7ff;
            --surface: #ffffff;
            --text: #14213d;
            --muted: #5d6c87;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, #f7faff 0%, #eef3fa 100%);
        }
        .offline-card {
            width: min(100%, 560px);
            background: var(--surface);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 24px 54px rgba(11, 31, 66, 0.12);
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 18px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 2.5rem);
            line-height: 1.05;
        }
        p {
            margin: 0;
            line-height: 1.7;
            color: var(--muted);
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-secondary {
            border: 1px solid rgba(13, 45, 98, 0.14);
            color: var(--primary);
            background: #fff;
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <span class="badge">Modo offline</span>
        <h1>Sem conexão no momento</h1>
        <p>
            O hub PrefSADE Serviços Digitais não conseguiu acessar a internet.
            Verifique sua conexão e tente novamente para continuar utilizando os serviços online da Prefeitura.
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="/app/">Tentar novamente</a>
            <a class="btn btn-secondary" href="https://www.santoantoniododescoberto.go.gov.br/">Portal oficial</a>
        </div>
    </main>
</body>
</html>
